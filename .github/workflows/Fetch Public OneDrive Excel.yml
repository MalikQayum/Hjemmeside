
name: Fetch Public OneDrive Excel

on:
  workflow_dispatch:
  schedule:
    # Every day at 03:15 UTC
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: fetch-parking-excel
  cancel-in-progress: false

jobs:
  download-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Excel from OneDrive
        shell: bash
        run: |
          set -euo pipefail

          RAW_LINK="https://onedrive.live.com/:x:/g/personal/4560751AFE576670/IQBwZlf-GnVgIIBFLAMAAAAAAdAuxtxL8NaM5-kU-dsTUvA?resid=4560751AFE576670!812&ithint=file%2Cxlsx&e=1ZeEZo&migratedtospo=true&redeem=aHR0cHM6Ly8xZHJ2Lm1zL3gvYy80NTYwNzUxYWZlNTc2NjcwL0lRQndabGYtR25WZ0lJQkZMQU1BQUFBQUFkQXV4dHhMOE5hTTUta1UtZHNUVXZBP2U9MVplRVpv"
          DIRECT_DOWNLOAD_URL="${RAW_LINK}&download=1"
          FILE="Venteliste Parkering.xlsx"

          echo "Downloading Excel workbook..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 180 \
            "$DIRECT_DOWNLOAD_URL" \
            --output "$FILE"

          if [ ! -s "$FILE" ]; then
            echo "::error::Downloaded file is empty."
            exit 1
          fi

          if ! unzip -t "$FILE" >/dev/null 2>&1; then
            echo "::error::Download is not a valid XLSX workbook."
            echo "OneDrive may require authentication or different sharing permissions."
            rm -f "$FILE"
            exit 1
          fi

          echo "Excel workbook downloaded and validated."
          ls -lh "$FILE"

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.name "github-actions[bot]"
          git config --local user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "Venteliste Parkering.xlsx"

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "Automated update: Venteliste Parkering.xlsx"
          git push
