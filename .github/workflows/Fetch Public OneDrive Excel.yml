
name: Sync Parking Excel from OneDrive

on:
  workflow_dispatch:
  schedule:
    # Once daily at 03:15 UTC
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-onedrive-excel
  cancel-in-progress: false

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Excel file from OneDrive
        shell: bash
        env:
          ONEDRIVE_URL: "https://1drv.ms/x/c/4560751afe576670/IQBwZlf-GnVgIIBFLAMAAAAAAacgNjZehh4H7Nvmzuz5pZA?e=QnbqXO"
        run: |
          set -euo pipefail

          mkdir -p data

          # Request a direct download rather than the Excel preview.
          DOWNLOAD_URL="${ONEDRIVE_URL}&download=1"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-redirs 10 \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            "$DOWNLOAD_URL" \
            --output data/parkering.xlsx

          # Ensure the response is a valid XLSX file.
          if ! unzip -t data/parkering.xlsx >/dev/null 2>&1; then
            echo "::error::Download did not produce a valid Excel workbook."
            echo "Check the OneDrive sharing permissions and download link."
            exit 1
          fi

          echo "Excel workbook downloaded successfully."

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/parkering.xlsx

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "Update parking Excel workbook"
          git push
