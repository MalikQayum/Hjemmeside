
name: Sync Parking Excel from OneDrive

on:
  workflow_dispatch:
  schedule:
    # Run every hour at minute 15 (UTC)
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-onedrive-excel
  cancel-in-progress: false

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Excel file from OneDrive
        shell: bash
        env:
          ONEDRIVE_URL: "https://1drv.ms/x/c/4560751afe576670/IQBwZlf-GnVgIIBFLAMAAAAAAacgNjZehh4H7Nvmzuz5pZA?e=QnbqXO"
        run: |
          set -euo pipefail

          mkdir -p data

          # Convert the OneDrive sharing URL into a share ID.
          SHARE_ID="$(
            printf '%s' "$ONEDRIVE_URL" |
            base64 -w 0 |
            tr '+/' '-_' |
            tr -d '='
          )"

          DOWNLOAD_URL="https://api.onedrive.com/v1.0/shares/u!${SHARE_ID}/root/content"

          # Download the workbook.
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            "$DOWNLOAD_URL" \
            --output data/parkering.xlsx

          # Verify that the downloaded file is an XLSX workbook.
          if ! unzip -t data/parkering.xlsx >/dev/null 2>&1; then
            echo "::error::The downloaded file is not a valid XLSX workbook."
            exit 1
          fi

          echo "Workbook downloaded and validated successfully."

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/parkering.xlsx

          if git diff --cached --quiet; then
            echo "The workbook has not changed. No commit needed."
            exit 0
          fi

          git commit -m "Update parking Excel workbook"
          git push
