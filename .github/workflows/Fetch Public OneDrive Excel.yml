name: Fetch Public OneDrive Excel

on:
  workflow_dispatch: # Allows manual trigger anytime
  schedule:
    - cron: '0 0 * * 0' # ⏰ Runs once a week every Sunday at midnight UTC

jobs:
  download-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Excel directly from OneDrive
        run: |
          # 1. Define the raw link base (stripping the tracking parameters)
          RAW_LINK="https://1drv.ms/x/c/4560751afe576670/IQBwZlf-GnVgIIBFLAMAAAAAAdAuxtxL8NaM5-kU-dsTUvA?e=1ZeEZo"
          
          # 2. Append the forced download command string
          DIRECT_DOWNLOAD_URL="${RAW_LINK}?download=1"
          
          echo "Downloading file..."
          # 3. Stream it safely into the workspace using the correct file name
          curl -L "$DIRECT_DOWNLOAD_URL" -o "Venteliste Parkering.xlsx"

      - name: Verify file content
        run: |
          if [ -s "Venteliste Parkering.xlsx" ]; then
            echo "✅ Excel file downloaded successfully."
            ls -lh "Venteliste Parkering.xlsx"
          else
            echo "❌ Download failed or file is empty."
            exit 1
          fi

      - name: Save file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: parking-waiting-list
          path: "Venteliste Parkering.xlsx"

