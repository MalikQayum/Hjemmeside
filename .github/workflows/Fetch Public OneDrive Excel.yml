name: Fetch Public OneDrive Excel

on:
  workflow_dispatch: # Allows manual trigger anytime
  schedule:
    - cron: '0 0 * * 0' # ⏰ Runs once a week every Sunday at midnight UTC

# Required permissions to allow GitHub Actions to commit files back to your repo
permissions:
  contents: write

jobs:
  download-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Excel directly from OneDrive
        run: |
          RAW_LINK="https://1drv.ms/x/c/4560751afe576670/IQBwZlf-GnVgIIBFLAMAAAAAAdAuxtxL8NaM5-kU-dsTUvA?e=1ZeEZo"
          DIRECT_DOWNLOAD_URL="${RAW_LINK}?download=1"
          
          echo "Downloading file..."
          curl -L "$DIRECT_DOWNLOAD_URL" -o "Venteliste Parkering.xlsx"

      - name: Verify file content
        run: |
          if [ -s "Venteliste Parkering.xlsx" ]; then
            echo "✅ Excel file downloaded successfully."
            ls -lh "Venteliste Parkering.xlsx"
          else
            echo "❌ Download failed or file is empty."
            exit 1
          fi

      # NEW STEP: Commit and push the file to your main repository branch
      - name: Commit and push changes
        run: |
          # 1. Configure the native GitHub Actions bot identity
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          # 2. Stage the newly downloaded or updated Excel file
          git add "Venteliste Parkering.xlsx"
          
          # 3. Only commit if the Excel sheet data has actually changed since last week
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes detected in the parking list. Skipping commit."
          else
            echo "Changes detected! Committing and pushing..."
            git commit -m "Automated update: Venteliste Parkering.xlsx"
            git push
          fi
