name: Fetch Public OneDrive Excel

on:
  workflow_dispatch: # Allows manual trigger anytime
  schedule:
    - cron: '0 0 * * 0' # ⏰ Runs once a week every Sunday at midnight UTC

jobs:
  download-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert link and download Excel
        env:
          ONEDRIVE_PUBLIC_LINK: "https://1drv.ms/x/c/4560751afe576670/IQBwZlf-GnVgIIBFLAMAAAAAAdAuxtxL8NaM5-kU-dsTUvA?e=1ZeEZo"
        run: |
          CLEANED_URL=$(echo "$ONEDRIVE_PUBLIC_LINK" | cut -d'?' -f1)
          BASE64_URL=$(echo -n "$CLEANED_URL" | base64 | tr -d '\n' | tr -d '=' | tr '/' '_' | tr '+' '-')
          DIRECT_DOWNLOAD_URL="https://onedrive.com{BASE64_URL}/root/content"
          
          echo "Downloading file..."
          curl -L "$DIRECT_DOWNLOAD_URL" -o "Venteliste Parkering.xlsx"

      - name: Verify file content
        run: |
          if [ -s "Venteliste Parkering.xlsx" ]; then
            echo "✅ Excel file downloaded successfully."
            ls -lh "Venteliste Parkering.xlsx"
          else
            echo "❌ Download failed or file is empty."
            exit 1
          fi

      - name: Save file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: parking-waiting-list
          path: "Venteliste Parkering.xlsx"
