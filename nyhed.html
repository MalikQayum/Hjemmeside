<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      name="description"
      content="Nyheder, nyhedsbreve og referater fra bestyrelsen i Ejerforeningen Skyttegård/Vigerslev."

    <title>Nyheder | Ejerforeningen Skyttegård/Vigerslev</title>
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
      #docx-container {
          width: 100%;
          overflow-x: auto;
          background: #f1f1f1;
          padding: 20px 0;
      }
      
      #docx-container .docx-wrapper {
          background: #f1f1f1;
          padding: 20px;
      }
      
      #docx-container .docx {
          margin: 0 auto;
          box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      }
      </style>
  </head>
  <body class="is-preload">
    <div id="wrapper">
      <main id="main">
        <div class="inner">
          <header id="header">
            <a href="index.html" class="logo"><strong>Skyttegård/Vigerslev</strong></a>
          </header>

          <section id="banner">
            <div class="content">
              <header>
                <h1>Nyheder</h1>
                <p>Velkommen til Skyttegård/Vigerslevs hjemmeside.</p>
              </header>
              <p>Her finder du nyhedsbreve fra bestyrelsen.</p>

              <div id="docx-container">
                  <p>Indlæser dokument...</p>
              </div>

              <!--
              <div class="onedrive-container">
                <iframe
                  src="https://1drv.ms/w/c/4560751afe576670/IQR977YMhCSTTJTBAhlFQpncAaRRHvAanXQt2e04PxEKA5k"

                  width="100%"

                  loading="lazy"
                ></iframe>
              </div>
              -->
            </div>
          </section>
        </div>
      </main>

      <aside id="sidebar" aria-label="Navigation og kontakt"></aside>
    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/load-sidebar.js"></script>
    <script src="https://unpkg.com/docx-preview@0.3.6/dist/docx-preview.js"></script>

    <script>
    async function renderDocx(fileUrl) {
        const container = document.getElementById("docx-container");
    
        try {
            container.innerHTML = "<p>Indlæser dokument...</p>";
    
            const response = await fetch(fileUrl);
    
            if (!response.ok) {
                throw new Error("Kunne ikke hente dokumentet.");
            }
    
            const blob = await response.blob();
    
            container.innerHTML = "";
    
            await docx.renderAsync(
                blob,
                container,
                container,
                {
                    className: "docx",
                    inWrapper: true,
                    ignoreWidth: false,
                    ignoreHeight: false,
                    breakPages: true
                }
            );
    
        } catch (error) {
            console.error(error);
            container.innerHTML = "<p>Dokumentet kunne ikke indlæses.</p>";
        }
    }
    
    renderDocx("Nyhedsbrev.docx");
    </script>
  </body>
</html>
