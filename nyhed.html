<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Nyheder, nyhedsbreve og referater fra bestyrelsen i Ejerforeningen Skyttegård/Vigerslev."
    />
    <title>Nyheder | Ejerforeningen Skyttegård/Vigerslev</title>

    <link rel="stylesheet" href="/assets/css/main.css" />

    <!-- DOCX styling -->
    <style>
      #docx-container {
        width: 100%;
        overflow-x: auto;
        background: #f1f1f1;
        padding: 20px 0;
      }

      #docx-container .docx-wrapper {
        background: #f1f1f1;
        padding: 20px;
      }

      #docx-container .docx {
        margin: 0 auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      #docx-container .docx-wrapper > section {
        margin-bottom: 20px;
      }

      @media screen and (max-width: 736px) {
        #docx-container {
          padding: 10px 0;
        }

        #docx-container .docx-wrapper {
          padding: 5px;
        }
      }

      .docx-error {
        padding: 20px;
        text-align: center;
        background: #fff;
        border-radius: 4px;
      }
    </style>
  </head>

  <body class="is-preload">
    <div id="wrapper">
      <main id="main">
        <div class="inner">

          <header id="header">
            <a href="/" class="logo">
              <strong>Skyttegård/Vigerslev</strong>
            </a>
          </header>

          <section id="banner">
            <div class="content">

              <header>
                <h1>Nyheder</h1>
                <p>Velkommen til Skyttegård/Vigerslevs hjemmeside.</p>
              </header>

              <p>Her finder du nyhedsbreve fra bestyrelsen.</p>

              <!-- DOCX document viewer -->
              <div id="docx-container" aria-live="polite">
                <p>Indlæser nyhedsbrev...</p>
              </div>

              <noscript>
                <p>
                  JavaScript skal være aktiveret for at vise nyhedsbrevet.
                </p>
              </noscript>
            </div>
          </section>
        </div>
      </main>

      <aside id="sidebar" aria-label="Navigation og kontakt"></aside>
    </div>

    <!-- Existing website scripts -->
    <script src="/assets/js/jquery.min.js"></script>
    <script src="/assets/js/browser.min.js"></script>
    <script src="/assets/js/breakpoints.min.js"></script>
    <script src="/assets/js/util.js"></script>
    <script src="/assets/js/load-sidebar.js"></script>

    <!-- DOCX dependencies: JSZip must load first -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/docx-preview@0.3.6/dist/docx-preview.js"></script>

    <!-- DOCX renderer -->
    <script>
      async function renderDocx(fileUrl) {
        const container = document.getElementById("docx-container");

        try {
          container.innerHTML = "<p>Indlæser nyhedsbrev...</p>";

          // Verify dependencies
          if (typeof JSZip === "undefined") {
            throw new Error("JSZip kunne ikke indlæses.");
          }

          if (typeof docx === "undefined" || typeof docx.renderAsync !== "function") {
            throw new Error("DOCX-preview kunne ikke indlæses.");
          }

          // Fetch document
          const response = await fetch(fileUrl);

          if (!response.ok) {
            throw new Error(
              `Kunne ikke hente dokumentet. HTTP ${response.status}`
            );
          }

          const blob = await response.blob();

          if (blob.size === 0) {
            throw new Error("Dokumentet er tomt.");
          }

          // Clear loading message
          container.innerHTML = "";

          // Render Word document
          await docx.renderAsync(
            blob,
            container,
            container,
            {
              className: "docx",
              inWrapper: true,
              ignoreWidth: false,
              ignoreHeight: false,
              breakPages: true,
              ignoreFonts: false,
              renderHeaders: true,
              renderFooters: true,
              renderFootnotes: true,
              renderEndnotes: true
            }
          );

        } catch (error) {
          console.error("DOCX rendering error:", error);

          container.innerHTML = `
            <div class="docx-error">
              <p>Nyhedsbrevet kunne ikke indlæses. Prøv igen senere.</p>
            </div>
          `;
        }
      }

      // Load document when page is ready
      document.addEventListener("DOMContentLoaded", () => {
        renderDocx("/Nyhedsbrev.docx");
      });
    </script>

  </body>
</html>
