
<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Læs ejerforeningens vedtægter og husorden."
    />
    <title>Husorden og vedtægter | Ejerforeningen Skyttegård/Vigerslev</title>

    <link rel="stylesheet" href="assets/css/main.css" />

    <style>
      /* PDF document viewer */

      .pdf-container {
        width: 100%;
        margin-bottom: 40px;
        background: #f1f1f1;
        padding: 15px;
        border-radius: 4px;
      }

      .pdf-container iframe {
        display: block;
        width: 100%;
        height: 1000px;
        border: none;
        background: #fff;
      }

      .pdf-heading {
        margin-bottom: 15px;
      }

      .pdf-download {
        display: inline-block;
        margin-top: 10px;
      }

      @media screen and (max-width: 736px) {
        .pdf-container {
          padding: 5px;
        }

        .pdf-container iframe {
          height: 750px;
        }
      }
    </style>
  </head>

  <body class="is-preload">
    <div id="wrapper">
      <main id="main">
        <div class="inner">

          <header id="header">
            <a href="index.html" class="logo">
              <strong>Skyttegård/Vigerslev</strong>
            </a>
          </header>

          <section id="banner">
            <div class="content">

              <header>
                <h1>Husorden og vedtægter</h1>
                <p>Vigtige dokumenter for ejere og beboere.</p>
              </header>

              <!-- Husorden -->
              <section>
                <header class="pdf-heading">
                  <h2>Husorden</h2>
                  <p>Ejerforeningens gældende husorden.</p>
                </header>

                <div class="pdf-container">
                  <iframe
                    src="Husorden.pdf#toolbar=1&navpanes=0&view=FitH"
                    title="Ejerforeningens husorden"
                    loading="lazy"
                  ></iframe>
                </div>

                <p>
                  <a href="Husorden.pdf" download class="pdf-download">
                    <span class="icon solid fa-download"></span>
                    Download husorden (PDF)
                  </a>
                </p>
              </section>

              <hr />

              <!-- Vedtægter -->
              <section>
                <header class="pdf-heading">
                  <h2>Vedtægter</h2>
                  <p>Ejerforeningens gældende vedtægter.</p>
                </header>

                <div class="pdf-container">
                  <iframe
                    src="Vedtægter.pdf#toolbar=1&navpanes=0&view=FitH"
                    title="Ejerforeningens vedtægter"
                    loading="lazy"
                  ></iframe>
                </div>

                <p>
                  <a href="Vedtægter.pdf" download class="pdf-download">
                    <span class="icon solid fa-download"></span>
                    Download vedtægter (PDF)
                  </a>
                </p>
              </section>

            </div>
          </section>
        </div>
      </main>

      <aside id="sidebar" aria-label="Navigation og kontakt"></aside>
    </div>

    <!-- Existing website scripts -->
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/load-sidebar.js"></script>

  </body>
</html>
