
<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Læs ejerforeningens vedtægter og husorden."
    />
    <title>Husorden og vedtægter | Ejerforeningen Skyttegård/Vigerslev</title>

    <link rel="stylesheet" href="assets/css/main.css" />

    <style>
      /* PDF viewer */

      .pdf-container {
        width: 100%;
        margin-bottom: 40px;
        padding: 15px;
        background: #f1f1f1;
        overflow: hidden;
        border-radius: 4px;
      }

      .pdf-page {
        display: block;
        width: 100%;
        height: auto;
        margin: 0 auto 20px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      .pdf-loading {
        text-align: center;
        padding: 30px;
      }

      .pdf-error {
        padding: 20px;
        text-align: center;
        background: #fff;
      }

      .pdf-heading {
        margin-bottom: 15px;
      }

      @media screen and (max-width: 736px) {
        .pdf-container {
          padding: 5px;
        }

        .pdf-page {
          margin-bottom: 10px;
        }
      }
    </style>
  </head>

  <body class="is-preload">
    <div id="wrapper">
      <main id="main">
        <div class="inner">

          <header id="header">
            <a href="index.html" class="logo">
              <strong>Skyttegård/Vigerslev</strong>
            </a>
          </header>

          <section id="banner">
            <div class="content">

              <header>
                <h1>Husorden og vedtægter</h1>
                <p>Vigtige dokumenter for ejere og beboere.</p>
              </header>

              <!-- Husorden -->
              <section>
                <header class="pdf-heading">
                  <h2>Husorden</h2>
                  <p>Ejerforeningens gældende husorden.</p>
                </header>

                <div
                  id="husorden-pdf"
                  class="pdf-container"
                  aria-live="polite"
                >
                  <p class="pdf-loading">Indlæser husorden...</p>
                </div>

                <p>
                  <a href="Husorden.pdf" download>
                    <span class="icon solid fa-download"></span>
                    Download husorden (PDF)
                  </a>
                </p>
              </section>

              <hr />

              <!-- Vedtægter -->
              <section>
                <header class="pdf-heading">
                  <h2>Vedtægter</h2>
                  <p>Ejerforeningens gældende vedtægter.</p>
                </header>

                <div
                  id="vedtaegter-pdf"
                  class="pdf-container"
                  aria-live="polite"
                >
                  <p class="pdf-loading">Indlæser vedtægter...</p>
                </div>

                <p>
                  <a href="Vedtægter.pdf" download>
                    <span class="icon solid fa-download"></span>
                    Download vedtægter (PDF)
                  </a>
                </p>
              </section>

            </div>
          </section>
        </div>
      </main>

      <aside id="sidebar" aria-label="Navigation og kontakt"></aside>
    </div>

    <!-- Existing website scripts -->
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/load-sidebar.js"></script>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
      // Configure PDF.js worker
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


      /**
       * Render a PDF document directly into the webpage.
       *
       * @param {string} file       PDF filename
       * @param {string} containerId Target HTML element
       */
      async function renderPDF(file, containerId) {
        const container = document.getElementById(containerId);

        if (!container) return;

        try {
          container.innerHTML =
            '<p class="pdf-loading">Indlæser dokument...</p>';

          // Load PDF
          const pdf = await pdfjsLib.getDocument(file).promise;

          container.innerHTML = "";

          // Render each page
          for (
            let pageNumber = 1;
            pageNumber <= pdf.numPages;
            pageNumber++
          ) {
            const page = await pdf.getPage(pageNumber);

            // Calculate scale based on available width
            const baseViewport = page.getViewport({ scale: 1 });

            const containerWidth = container.clientWidth - 10;

            const scale = containerWidth / baseViewport.width;

            const viewport = page.getViewport({ scale });

            // Create canvas
            const canvas = document.createElement("canvas");

            const context = canvas.getContext("2d");

            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);

            canvas.className = "pdf-page";

            container.appendChild(canvas);

            // Render page
            await page.render({
              canvasContext: context,
              viewport: viewport
            }).promise;
          }

        } catch (error) {
          console.error("PDF rendering error:", file, error);

          container.innerHTML = `
            <div class="pdf-error">
              <p>Dokumentet kunne ikke indlæses.</p>
              <a href="${file}" download>
                Download dokumentet her
              </a>
            </div>
          `;
        }
      }


      // Load both documents when the page is ready
      document.addEventListener("DOMContentLoaded", () => {
        renderPDF("Husorden.pdf", "husorden-pdf");
        renderPDF("Vedtægter.pdf", "vedtaegter-pdf");
      });
    </script>

  </body>
</html>
